name: Weekly Lyfta Workout Digest

on:
  schedule:
    # Se ejecuta a las 00:00 UTC y a las 01:00 UTC del Domingo.
    # Estas dos horas cubren de forma exacta las 21:00 hrs (9:00 PM) del Sábado en Chile:
    # - En Horario de Verano (UTC-3): 00:00 UTC Domingo = 21:00 CLT Sábado.
    # - En Horario de Invierno (UTC-4): 01:00 UTC Domingo = 21:00 CLT Sábado.
    - cron: '0 0,1 * * 0'
  # Permite ejecutar manualmente el pipeline en cualquier momento desde la pestaña 'Actions'
  workflow_dispatch:

jobs:
  workout-digest:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-alpine

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python --version
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Ejecutar script de extracción y envío
        env:
          LYFTA_API_KEY: ${{ secrets.LYFTA_API_KEY || secrets.LYFTA }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py
