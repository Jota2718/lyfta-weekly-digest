name: Weekly Lyfta Workout Digest

on:
  schedule:
    # Se ejecuta a las 00:15 UTC y a las 01:15 UTC del Domingo.
    # El minuto :15 evita la congestión global de GitHub Actions en el minuto :00.
    # - En Horario de Verano de Chile (UTC-3): 00:15 UTC = Sábado 21:15 CLT.
    # - En Horario de Invierno de Chile (UTC-4): 01:15 UTC = Sábado 21:15 CLT.
    - cron: '15 0,1 * * 0'
  # Permite ejecutar manualmente el pipeline en cualquier momento desde la pestaña 'Actions'
  workflow_dispatch:

jobs:
  workout-digest:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-alpine

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema y Python
        run: |
          apk add --no-cache tar
          python --version
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Calcular identificador de semana objetivo
        run: |
          python -c "
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Santiago'))
          today = now.date()
          if today.weekday() == 5:
              sat = today
          elif today.weekday() == 6:
              sat = today - timedelta(days=1)
          else:
              sat = today
          print(f'TARGET_WEEK={sat.strftime(\"%Y-%m-%d\")}')
          " >> $GITHUB_ENV

      - name: Restaurar marca de envío semanal
        uses: actions/cache@v4
        with:
          path: .sent_marker
          key: lyfta-sent-${{ env.TARGET_WEEK }}

      - name: Ejecutar script de extracción y envío
        env:
          LYFTA_API_KEY: ${{ secrets.LYFTA_API_KEY || secrets.LYFTA }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py
